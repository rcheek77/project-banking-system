<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RSC Banking System</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

</head>
<body>



<div id="dashboard">

    <h1>RSC Banking System</h1>

    <div class = "banking-col">
        <h2>Deposit</h2>
        <p>
            £<span id="deposit">0.00</span>
        </p>
    </div>

    <div class = "banking-col">
        <h2>Withdraw</h2>
        <p>
            £<span id="withdraw">0.00</span>
        </p>
    </div>

    <div class = "banking-col">
        <h2>Balance</h2>
        <p>
            £<span id="balance">100.00</span>
        </p>
    </div>

    <div id="input-section" class="mt-5 d-flex justify-content-center">
            <div class="col-md-5 container rounded shadow p-4" style="background-color: #fad0f3;">
                <h3>Deposit</h3>
                <input type="number" class="form-control" id="deposit-input" placeholder="Deposit">
                <br>
                <button class="btn btn-success" id="deposit-btn">Deposit</button>
            </div>
            <div class="col-md-5 container rounded shadow p-4" style="background-color: #fad0f3;">
                <h3>Withdraw</h3>
                <input type="number" class="form-control" id="withdraw-input" placeholder="Withdraw">
                <br>
                <button class="btn btn-success" id="withdraw-btn">Withdraw</button>
            </div>
    </div>



</div>

<script type="module" src="index.js"></script>
    
</body>
</html>
